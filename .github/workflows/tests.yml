name: Unit tests

on:
  push:
    branches:
      - feature/v2-architecture
      - feature/document-workflow-generator
  pull_request:
    branches:
      - main
      - feature/hand-pointer-drag
      - feature/v2-architecture
      - feature/document-workflow-generator
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript and run pointer geometry tests
        run: |
          node --check web/pointer-geometry.js
          node --check web/pointer-event-buffer.js
          node --check web/display-shell.js
          node --check web/display-page.js
          node --check web/player.js
          node --check web/workflows.js
          node --check web/display-pages.js
          node --check web/usage-flow.js
          node --check web/admin.js
          node --check web/app.js
          node --test tests/*.test.cjs
